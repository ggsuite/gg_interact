dependencies:
  gg_console_colors: ^2.5.0
  interact: ^2.2.0

dev_dependencies:
  dna_ggsuite: ^1.0.0
  gg_status_printer: ^1.6.3
  helix: ^1.14.0
  lints: ^6.1.0
  test: ^1.33.0
